<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng nhập giáo viên</title>

      <link
    rel="stylesheet"
    href="./login.css"
>


</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <div class="login-icon">
                👩‍🏫
            </div>

            <h1>
                Đăng nhập giáo viên
            </h1>

            <p>
                Quản lý nội dung học tập
            </p>


            <input
                id="email"
                type="email"
                placeholder="Email"
            >


            <input
                id="password"
                type="password"
                placeholder="Mật khẩu"
            >


            <button id="loginButton">
                Đăng nhập
            </button>


            <p
                id="message"
                class="message"
            ></p>


            <a href="register.html">
                Chưa có tài khoản?
                Đăng ký giáo viên
            </a>


            <a href="index.html">
                ← Quay lại trang chủ
            </a>

        </div>

    </div>


    <script src="/static/login.js"></script>

</body>

</html>
